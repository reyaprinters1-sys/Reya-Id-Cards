name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Android Debug APK
      run: |
        # Check if project files are inside subfolder or root
        if [ -f "Reya-Id-Cards-main/build.gradle.kts" ]; then
          cd Reya-Id-Cards-main
        fi
        
        # Ensure wrapper is generated for this project
        gradle wrapper --gradle-version 8.7 --distribution-type bin
        chmod +x gradlew
        
        # Build the debug APK directly
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Reya-Id-Cards-APK
        path: "**/app/build/outputs/apk/debug/*.apk"
